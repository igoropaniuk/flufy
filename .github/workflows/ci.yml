name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs required by PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl-dev

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run CI checks
        run: poetry run bash ./scripts/ci-check
